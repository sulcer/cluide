<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#222">MCP merge: five sources, one list per scope</text>

  <!-- sources -->
  <g stroke="#333" stroke-width="1.2">
    <rect x="20" y="50"  width="330" height="52" rx="6" fill="#eef4ff"/>
    <rect x="20" y="114" width="330" height="52" rx="6" fill="#eef4ff"/>
    <rect x="20" y="178" width="330" height="52" rx="6" fill="#eef4ff"/>
    <rect x="20" y="242" width="330" height="52" rx="6" fill="#f2f2f2"/>
    <rect x="20" y="306" width="330" height="52" rx="6" fill="#f2f2f2"/>
  </g>
  <g fill="#222">
    <text x="32" y="70" font-weight="600">1 · local</text>
    <text x="32" y="90">~/.claude.json → projects[path].mcpServers</text>
    <text x="32" y="134" font-weight="600">2 · project</text>
    <text x="32" y="154">&lt;repo&gt;/.mcp.json → mcpServers</text>
    <text x="32" y="198" font-weight="600">3 · user</text>
    <text x="32" y="218">~/.claude.json → mcpServers</text>
    <text x="32" y="262" font-weight="600">4 · plugin (read only)</text>
    <text x="32" y="282">&lt;plugin install path&gt;/.mcp.json, enabled plugins only</text>
    <text x="32" y="326" font-weight="600">5 · managed (read only)</text>
    <text x="32" y="346">~/.claude/settings.json → managedMcpServers</text>
  </g>
  <text x="20" y="385" fill="#555" font-size="11">Highest precedence wins. Fields are never merged across scopes.</text>
  <text x="20" y="402" fill="#555" font-size="11">scope=global sees 3, 4, 5. A project scope sees all five.</text>

  <!-- arrows to merge -->
  <g stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" fill="none">
    <path d="M 350 76  C 400 76,  400 200, 438 200"/>
    <path d="M 350 140 C 400 140, 400 200, 438 200"/>
    <path d="M 350 204 L 438 204"/>
    <path d="M 350 268 C 400 268, 400 208, 438 208"/>
    <path d="M 350 332 C 400 332, 400 212, 438 212"/>
  </g>

  <!-- merge box -->
  <rect x="440" y="150" width="200" height="110" rx="6" fill="#f3f8f1" stroke="#2f7d32" stroke-width="1.4"/>
  <text x="540" y="176" text-anchor="middle" font-weight="600" fill="#1f4d21">Group by name</text>
  <text x="540" y="198" text-anchor="middle" fill="#222">lowest number wins</text>
  <text x="540" y="216" text-anchor="middle" fill="#222">winner: effective = true</text>
  <text x="540" y="234" text-anchor="middle" fill="#222">others: shadowedBy = winner</text>

  <!-- arrow to list -->
  <line x1="640" y1="205" x2="698" y2="205" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- output list -->
  <rect x="700" y="120" width="220" height="170" rx="6" fill="#fff8e6" stroke="#b8860b" stroke-width="1.4"/>
  <text x="810" y="146" text-anchor="middle" font-weight="600" fill="#5c4300">McpEntry[]</text>
  <text x="810" y="170" text-anchor="middle" fill="#222">name · scope · file</text>
  <text x="810" y="188" text-anchor="middle" fill="#222">config</text>
  <text x="810" y="206" text-anchor="middle" fill="#222">effective · shadowedBy</text>
  <text x="810" y="224" text-anchor="middle" fill="#222">enabled (project only)</text>
  <text x="810" y="242" text-anchor="middle" fill="#222">etag (editable scopes)</text>
  <text x="810" y="272" text-anchor="middle" fill="#555" font-size="11">edits write back to `file`</text>

  <!-- approval box -->
  <rect x="440" y="310" width="200" height="80" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="332" text-anchor="middle" font-weight="600" fill="#333">Approval (project entries)</text>
  <text x="540" y="352" text-anchor="middle" fill="#222" font-size="11">&lt;repo&gt;/.claude/settings.local.json</text>
  <text x="540" y="368" text-anchor="middle" fill="#222" font-size="11">enabledMcpjsonServers / disabled…</text>
  <path d="M 640 350 C 680 350, 690 300, 720 292" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="675" y="325" fill="#555" font-size="11">sets enabled</text>
</svg>

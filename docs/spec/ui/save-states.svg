<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1100" height="380" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#222">Save states of every editor: file, settings, MCP sheet</text>

  <!-- states -->
  <g stroke="#333" stroke-width="1.2">
    <rect x="30"  y="120" width="130" height="60" rx="8" fill="#f3f8f1"/>
    <rect x="240" y="120" width="130" height="60" rx="8" fill="#eef4ff"/>
    <rect x="450" y="120" width="130" height="60" rx="8" fill="#fff8e6"/>
    <rect x="660" y="120" width="130" height="60" rx="8" fill="#f3f8f1"/>
    <rect x="870" y="120" width="180" height="60" rx="8" fill="#eef4ff"/>
    <rect x="450" y="260" width="180" height="60" rx="8" fill="#fdecec" stroke="#b00020"/>
    <rect x="240" y="260" width="130" height="60" rx="8" fill="#fdecec" stroke="#b00020"/>
  </g>
  <g fill="#222" text-anchor="middle" font-weight="600">
    <text x="95"  y="145">clean</text>
    <text x="305" y="145">dirty</text>
    <text x="515" y="145">saving</text>
    <text x="725" y="145">saved</text>
    <text x="960" y="145">diff sheet</text>
    <text x="540" y="285" fill="#7a0016">conflict dialog</text>
    <text x="305" y="285" fill="#7a0016">dirty + inline error</text>
  </g>
  <g fill="#555" text-anchor="middle" font-size="11">
    <text x="95"  y="165">"Saved" with check</text>
    <text x="305" y="165">dot · Discard · Save</text>
    <text x="515" y="165">Save disabled, spinner</text>
    <text x="725" y="165">toast "Saved · View diff"</text>
    <text x="960" y="165">unified diff, +n −n</text>
    <text x="540" y="305" fill="#7a0016">Reload (↵) · Overwrite</text>
    <text x="305" y="305" fill="#7a0016">code · message, Save enabled</text>
  </g>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="150" x2="238" y2="150"/>
    <line x1="370" y1="150" x2="448" y2="150"/>
    <line x1="580" y1="150" x2="658" y2="150"/>
    <line x1="790" y1="150" x2="868" y2="150"/>
    <path d="M 725 120 C 725 70, 95 70, 95 118"/>
    <path d="M 305 180 C 305 230, 95 230, 95 182"/>
    <path d="M 515 180 L 515 258"/>
    <path d="M 450 300 C 410 300, 380 240, 372 190"/>
    <path d="M 480 260 C 470 220, 520 200, 520 182"/>
    <path d="M 500 180 C 480 225, 330 225, 315 258" stroke="#b00020"/>
    <path d="M 305 260 L 305 182" stroke="#b00020"/>
    <path d="M 450 312 C 300 352, 60 330, 60 182" stroke="#b00020"/>
    <path d="M 960 180 C 960 230, 725 230, 725 182" stroke="#888" stroke-dasharray="4 3"/>
  </g>
  <g fill="#444" font-size="11">
    <text x="165" y="142">first keystroke</text>
    <text x="378" y="142">⌘S / Save</text>
    <text x="585" y="142">200 {etag, diff}</text>
    <text x="795" y="142">"View diff"</text>
    <text x="330" y="66">etag replaced, row returns to clean, focus stays</text>
    <text x="130" y="222">Esc / Discard, no confirmation</text>
    <text x="522" y="225">409</text>
    <text x="395" y="212" fill="#7a0016">400 / 422</text>
    <text x="312" y="238" fill="#7a0016">edit again</text>
    <text x="376" y="252">Esc / backdrop: stays dirty</text>
    <text x="440" y="200">Overwrite: PUT without etag</text>
    <text x="640" y="322" fill="#7a0016">Reload: drop edits, load the 409 body, toast "Reloaded"</text>
    <text x="800" y="245" fill="#888">Esc / Close</text>
  </g>
  <text x="20" y="360" fill="#555" font-size="11">Discard stays enabled while saving. beforeunload warns while dirty. Switching file, screen or scope drops a dirty edit; the diff sheet after the next save is the undo.</text>
</svg>
